<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Event Handling</title>
</head>
<body>

    <h2 id="title">JavaScript Event Handling</h2>

    <input type="text" id="name" placeholder="Enter Name">

    <button id="clickBtn">Click Me</button>

    <button id="dblBtn">Double Click</button>

    <form id="myForm">
        <input type="email" placeholder="Enter Email">
        <button type="submit">Submit</button>
    </form>

    <div id="parent" style="padding:30px;background:lightblue;margin-top:20px;">
        Parent
        <button id="child">Child Button</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
